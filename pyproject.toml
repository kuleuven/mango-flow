[project]
name = "mango-flow"
version = "0.2.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Borgermans", email = "paul.borgermans@kuleuven.be" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.0",
    "celery-redbeat>=2.4.2",
    "flask>=3.1.3",
    "humanize>=4.13.0",
    "jsonlines>=4.0.0",
    "mango-lib",
    "multidict>=6.7.1",
    "pydantic>=2.13.4",
    "python-irodsclient>=3.2.0",
    "pyyaml>=6.0.3",
    "redis>=8.0.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[project.entry-points."mango.cli.plugins"]
flow = "mango_flow.cli:register"

[project.optional-dependencies]
exiftool = [
    "pyexiftool>=0.5.6",
]

[tool.uv.sources]
mango-lib = { git = "https://github.com/kuleuven/mango-lib", branch = "development" }